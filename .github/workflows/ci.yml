name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux 64-bit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 \
            qt6-base-dev qt6-tools-dev qt6-svg-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libtag1-dev libspdlog-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror=return-type
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Diff check
        run: git diff --check
      - name: Package staging tree
        run: cmake --install build --prefix "$PWD/dist"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkj-rewired-linux-x86_64
          path: dist
          if-no-files-found: error

  windows:
    name: Windows 64-bit
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MSYS2 toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-spdlog
            mingw-w64-x86_64-python
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkj-rewired-windows-x86_64
          path: build/openkj.exe
          if-no-files-found: error
